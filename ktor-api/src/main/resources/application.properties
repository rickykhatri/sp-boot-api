spring.application.name=Ricky Khatri AI

# ── H2 Database (shared dev/prod configuration) ────────────────────────────
spring.datasource.url=jdbc:h2:file:${H2_DB_PATH:./data/ricky_khatri_ai};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Console ──────────────────────────────────────────────────────────────
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Chatbot / AI Model ───────────────────────────────────────────────────────
# Default: Ollama local model. Run Ollama locally for a free chatbot backend.
# Optional OpenAI fallback if you set CHAT_PROVIDER=openai and OPENAI_API_KEY.
chat.provider=${CHAT_PROVIDER:ollama}
chat.ollama.url=${OLLAMA_BASE_URL:http://localhost:11434}
chat.ollama.model=${OLLAMA_MODEL:llama3.2}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# ── Optional Local Multimodal Features ──────────────────────────────────────
vision.ollama.url=${VISION_OLLAMA_URL:http://localhost:11434}
vision.ollama.model=${VISION_OLLAMA_MODEL:llama3.2-vision}
image.provider=${IMAGE_PROVIDER:pollinations}
image.pollinations.url=${IMAGE_POLLINATIONS_URL:https://image.pollinations.ai}
image.generator.url=${IMAGE_GENERATOR_URL:http://localhost:7860}

# ── Spring Boot AI MCP Server configuration ─────────────────────────────────────────────────────
# For HTTP streaming MCP endpoint:
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# For SSE:
#spring.ai.mcp.server.protocol=SSE
# Optional server identity:
spring.ai.mcp.server.name=ricky-khatri-ai-mcp
spring.ai.mcp.server.version=1.0.0
# Optional server port (default: 8080):
#logging.level.org.springframework.ai=DEBUG